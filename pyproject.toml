[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ble-mobile-inventory"
version = "0.1.0"
description = "Two-stage BLE inventory and localization with a local and AWS dashboard"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "aiohttp>=3.11,<4", "bleak>=1,<4", "paho-mqtt>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "boto3>=1.35,<2", "platformio>=6.1,<7", "pyserial>=3.5,<4", "paramiko>=3.5,<5"]

[project.scripts]
ble-inventory = "ble_inventory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ble_inventory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
