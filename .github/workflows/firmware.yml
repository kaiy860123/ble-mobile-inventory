name: Build XIAO firmware
on:
  push:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.2.0
      - run: pio run --project-dir firmware -e A01 -e A02 -e A03 -e A04 -e T01 -e T02
      - uses: actions/upload-artifact@v4
        with:
          name: xiao-firmware
          path: firmware/.pio/build/*/*.bin
