name: Test and publish dashboard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: npm ci
      - run: npm test
      - run: python scripts/generate-demo.py --georeference-example
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - run: python scripts/package-project.py
      - uses: actions/upload-artifact@v4
        with:
          name: rpi-deployment
          path: deliverables/ble-mobile-inventory.tar.gz
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
