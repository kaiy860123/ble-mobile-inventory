[platformio]
default_envs = A01

[env]
platform = espressif32@6.10.0
board = seeed_xiao_esp32c3
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@2.3.6
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ADV_INTERVAL_MS=500
  -D RSSI_AT_1M=-59

[env:A01]
build_flags = ${env.build_flags} -D DEVICE_ROLE=1 -D DEVICE_ORDINAL=1
[env:A02]
build_flags = ${env.build_flags} -D DEVICE_ROLE=1 -D DEVICE_ORDINAL=2
[env:A03]
build_flags = ${env.build_flags} -D DEVICE_ROLE=1 -D DEVICE_ORDINAL=3
[env:A04]
build_flags = ${env.build_flags} -D DEVICE_ROLE=1 -D DEVICE_ORDINAL=4
[env:T01]
build_flags = ${env.build_flags} -D DEVICE_ROLE=2 -D DEVICE_ORDINAL=1
[env:T02]
build_flags = ${env.build_flags} -D DEVICE_ROLE=2 -D DEVICE_ORDINAL=2
[env:A05]
build_flags = ${env.build_flags} -D DEVICE_ROLE=1 -D DEVICE_ORDINAL=5
[env:T03]
build_flags = ${env.build_flags} -D DEVICE_ROLE=2 -D DEVICE_ORDINAL=3
